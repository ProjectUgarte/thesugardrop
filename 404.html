      'flavors': 'flavors.html',
      'about': 'about.html',
      'contact': 'contact.html'

    var first = location.pathname.slice(base.length).split('/')[0].toLowerCase();
    if (map[first]) location.replace(base + map[first]);
    window.SITE_BASE = base;
  })();
</script>
